<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shehan & Stephanie</title>

  <!-- WhatsApp / Social Preview -->
  <meta property="og:title" content="Shehan & Stephanie">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/">
  <meta property="og:image" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/preview.png">
  <meta property="og:image:alt" content="Shehan & Stephanie">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shehan & Stephanie">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/preview.png">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css?v=15">
</head>

<body>

  <!-- =====================================================
       OPENING SCREEN
  ====================================================== -->

  <div class="start-screen" id="startScreen">

    <!-- Soft moving lights -->
    <div class="ambient-light ambient-one"></div>
    <div class="ambient-light ambient-two"></div>

    <!-- Cinematic light beam -->
    <div class="light-beam"></div>

    <!-- Central glow -->
    <div class="center-glow"></div>

    <!-- Subtle film grain -->
    <div class="grain"></div>

    <!-- Interactive light -->
    <div class="touch-light" id="touchLight"></div>


    <!-- =================================================
         CENTER BOX
    ================================================== -->

    <div class="opening-box" id="openingBox">

      <div class="box-inner">

        <button
          class="start-button"
          id="startButton"
          aria-label="Tap to begin"
        >

          <span>TAP TO BEGIN</span>

          <i></i>

        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       VIDEO
  ====================================================== -->

  <div
    class="video-screen"
    id="videoScreen"
  >

    <video
      id="weddingVideo"
      playsinline
      preload="auto"
    >

      <source
        src="save-the-date.mp4"
        type="video/mp4"
      >

      Your browser does not support video playback.

    </video>

  </div>


  <!-- =====================================================
       FINAL SAVE THE DATE
  ====================================================== -->

  <main
    class="save-date"
    id="saveDate"
  >

    <section class="intro">

      <p>
        Out of every possibility,<br>
        life chose this one.<br>
        <span>Us.</span>
      </p>

    </section>


    <section class="couple">

      <h1>
        Shehan &amp; Stephanie
      </h1>

    </section>


    <section class="story">

      <p>
        What began as two separate stories<br>
        will now become one.
      </p>

      <p>
        With love and joy,<br>
        we invite you to celebrate the beginning of our forever.
      </p>

    </section>


    <section class="date">

      <p>
        12 • 12 • 2026
      </p>

    </section>


    <section class="share-section">

      <button
        class="share-button"
        id="shareButton"
      >
        Share This Save the Date
      </button>

    </section>

  </main>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    const startScreen =
      document.getElementById("startScreen");

    const openingBox =
      document.getElementById("openingBox");

    const startButton =
      document.getElementById("startButton");

    const videoScreen =
      document.getElementById("videoScreen");

    const weddingVideo =
      document.getElementById("weddingVideo");

    const saveDate =
      document.getElementById("saveDate");

    const shareButton =
      document.getElementById("shareButton");

    const touchLight =
      document.getElementById("touchLight");


    /* =====================================================
       INTERACTIVE LIGHT
    ====================================================== */

    let lightX =
      window.innerWidth / 2;

    let lightY =
      window.innerHeight / 2;

    let targetX =
      lightX;

    let targetY =
      lightY;


    function moveLight(x, y) {

      targetX = x;
      targetY = y;

    }


    function animateLight() {

      lightX +=
        (targetX - lightX) * 0.055;

      lightY +=
        (targetY - lightY) * 0.055;

      touchLight.style.transform =
        `translate3d(${lightX}px, ${lightY}px, 0)`;

      requestAnimationFrame(
        animateLight
      );

    }

    animateLight();


    /* =====================================================
       POINTER
    ====================================================== */

    document.addEventListener(
      "pointermove",
      function(event) {

        if (
          startScreen.classList.contains("hidden")
        ) {
          return;
        }

        moveLight(
          event.clientX,
          event.clientY
        );

      }
    );


    /* =====================================================
       TOUCH
    ====================================================== */

    document.addEventListener(
      "touchmove",
      function(event) {

        if (
          startScreen.classList.contains("hidden")
        ) {
          return;
        }

        if (
          event.touches.length
        ) {

          moveLight(
            event.touches[0].clientX,
            event.touches[0].clientY
          );

        }

      },
      {
        passive: true
      }
    );


    /* =====================================================
       TAP TO BEGIN
    ====================================================== */

    startButton.addEventListener(
      "click",
      async function() {

        if (
          startButton.disabled
        ) {
          return;
        }

        startButton.disabled = true;


        /*
          1. Put video on screen FIRST.
          This means there is no black gap.
        */

        videoScreen.classList.add(
          "active"
        );


        /*
          2. Start video directly from
          the user's interaction.
        */

        try {

          weddingVideo.currentTime = 0;

          await weddingVideo.play();

        } catch (error) {

          console.log(
            "Video playback error:",
            error
          );

        }


        /*
          3. Fade the opening away.
          Video is already underneath.
        */

        requestAnimationFrame(
          function() {

            startScreen.classList.add(
              "launching"
            );

          }
        );


        /*
          4. Completely remove the
          opening after transition.
        */

        setTimeout(
          function() {

            startScreen.classList.add(
              "hidden"
            );

          },
          850
        );

      }
    );


    /* =====================================================
       VIDEO FINISHED
    ====================================================== */

    weddingVideo.addEventListener(
      "ended",
      function() {

        videoScreen.classList.add(
          "finished"
        );


        setTimeout(
          function() {

            saveDate.classList.add(
              "show"
            );

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          },
          700
        );

      }
    );


    /* =====================================================
       SHARE
    ====================================================== */

    shareButton.addEventListener(
      "click",
      async function() {

        const shareData = {

          title:
            "Shehan & Stephanie",

          text:
            "Shehan & Stephanie\n12 • 12 • 2026",

          url:
            window.location.href

        };


        if (
          navigator.share
        ) {

          try {

            await navigator.share(
              shareData
            );

          } catch (error) {

            console.log(
              "Share cancelled."
            );

          }

        } else {

          const whatsappText =
            encodeURIComponent(
              "Shehan & Stephanie\n" +
              "12 • 12 • 2026\n\n" +
              window.location.href
            );

          window.open(
            "https://wa.me/?text=" +
            whatsappText,
            "_blank"
          );

        }

      }
    );

  </script>

</body>
</html>
