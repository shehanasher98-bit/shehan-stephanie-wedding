<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shehan & Stephanie</title>

  <!-- WhatsApp / Social Preview -->
  <meta property="og:title" content="Shehan & Stephanie">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/">
  <meta property="og:image" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/preview.png">
  <meta property="og:image:alt" content="Shehan & Stephanie">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shehan & Stephanie">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/preview.png">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css?v=11">
</head>

<body>

  <!-- =====================================================
       CINEMATIC OPENING
  ====================================================== -->

  <div class="start-screen" id="startScreen">

    <!-- Ambient light -->
    <div class="ambient-light ambient-one"></div>
    <div class="ambient-light ambient-two"></div>

    <!-- Moving cinematic beam -->
    <div class="light-beam"></div>

    <!-- Fine atmospheric glow -->
    <div class="center-glow"></div>

    <!-- Opening content -->
    <div class="opening-content">

      <div class="opening-message">

        <p>Out of every possibility,</p>
        <p>life chose this one.</p>

        <div class="opening-us">
          Us.
        </div>

      </div>

      <div class="tap-area">

        <button
          id="startButton"
          class="start-button"
          aria-label="Tap to begin"
        >
          <span>TAP TO BEGIN</span>
          <i></i>
        </button>

      </div>

    </div>

    <!-- Interactive light following pointer -->
    <div
      class="touch-light"
      id="touchLight"
    ></div>

    <!-- Transition flash -->
    <div
      class="transition-flash"
      id="transitionFlash"
    ></div>

  </div>


  <!-- =====================================================
       VIDEO
  ====================================================== -->

  <div
    class="video-screen"
    id="videoScreen"
  >

    <video
      id="weddingVideo"
      playsinline
      preload="auto"
    >

      <source
        src="save-the-date.mp4"
        type="video/mp4"
      >

      Your browser does not support video playback.

    </video>

  </div>


  <!-- =====================================================
       FINAL SAVE THE DATE
  ====================================================== -->

  <main
    class="save-date"
    id="saveDate"
  >

    <!-- Intro -->
    <section class="intro">

      <p>
        Out of every possibility,<br>
        life chose this one.<br>
        <span>Us.</span>
      </p>

    </section>


    <!-- Names -->
    <section class="couple">

      <h1>
        Shehan &amp; Stephanie
      </h1>

    </section>


    <!-- Story -->
    <section class="story">

      <p>
        What began as two separate stories<br>
        will now become one.
      </p>

      <p>
        With love and joy,<br>
        we invite you to celebrate the beginning of our forever.
      </p>

    </section>


    <!-- Date -->
    <section class="date">

      <p>
        12 • 12 • 2026
      </p>

    </section>


    <!-- Share -->
    <section class="share-section">

      <button
        class="share-button"
        id="shareButton"
      >
        Share This Save the Date
      </button>

    </section>

  </main>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");

    const videoScreen =
      document.getElementById("videoScreen");

    const weddingVideo =
      document.getElementById("weddingVideo");

    const saveDate =
      document.getElementById("saveDate");

    const shareButton =
      document.getElementById("shareButton");

    const touchLight =
      document.getElementById("touchLight");

    const transitionFlash =
      document.getElementById("transitionFlash");


    /* =====================================================
       INTERACTIVE LIGHT
    ====================================================== */

    let lightX = window.innerWidth / 2;
    let lightY = window.innerHeight / 2;

    let targetLightX = lightX;
    let targetLightY = lightY;


    function moveLight(x, y) {

      targetLightX = x;
      targetLightY = y;

    }


    function animateLight() {

      lightX +=
        (targetLightX - lightX) * 0.08;

      lightY +=
        (targetLightY - lightY) * 0.08;

      touchLight.style.transform =
        `translate3d(${lightX}px, ${lightY}px, 0)`;

      requestAnimationFrame(
        animateLight
      );

    }

    animateLight();


    /* =====================================================
       MOUSE
    ====================================================== */

    document.addEventListener(
      "pointermove",
      function(event) {

        if (
          startScreen.classList.contains("hidden")
        ) {
          return;
        }

        moveLight(
          event.clientX,
          event.clientY
        );

      }
    );


    /* =====================================================
       TOUCH
    ====================================================== */

    document.addEventListener(
      "touchmove",
      function(event) {

        if (
          startScreen.classList.contains("hidden")
        ) {
          return;
        }

        if (
          event.touches &&
          event.touches.length
        ) {

          moveLight(
            event.touches[0].clientX,
            event.touches[0].clientY
          );

        }

      },
      {
        passive: true
      }
    );


    /* =====================================================
       START VIDEO
    ====================================================== */

    startButton.addEventListener(
      "click",
      async function() {

        if (
          startButton.disabled
        ) {
          return;
        }

        startButton.disabled = true;


        /*
          Begin cinematic exit
        */

        startScreen.classList.add(
          "launching"
        );


        /*
          Start video immediately after
          the user's tap so mobile browsers
          allow audio.
        */

        try {

          weddingVideo.currentTime = 0;

          await weddingVideo.play();

        } catch (error) {

          console.log(
            "Video playback error:",
            error
          );

        }


        /*
          Bring video forward during the
          cinematic transition.
        */

        setTimeout(
          function() {

            videoScreen.classList.add(
              "active"
            );

          },
          350
        );


        /*
          Remove opening screen.
        */

        setTimeout(
          function() {

            startScreen.classList.add(
              "hidden"
            );

          },
          1200
        );

      }
    );


    /* =====================================================
       VIDEO END
    ====================================================== */

    weddingVideo.addEventListener(
      "ended",
      function() {

        videoScreen.classList.add(
          "finished"
        );


        /*
          Small cinematic pause before
          final invitation appears.
        */

        setTimeout(
          function() {

            saveDate.classList.add(
              "show"
            );

            window.scrollTo(
              {
                top: 0,
                behavior: "smooth"
              }
            );

          },
          650
        );

      }
    );


    /* =====================================================
       SHARE BUTTON
    ====================================================== */

    shareButton.addEventListener(
      "click",
      async function() {

        const shareData = {

          title:
            "Shehan & Stephanie",

          text:
            "Shehan & Stephanie\n12 • 12 • 2026",

          url:
            window.location.href

        };


        /*
          Native sharing on mobile
        */

        if (
          navigator.share
        ) {

          try {

            await navigator.share(
              shareData
            );

          } catch (error) {

            console.log(
              "Share cancelled."
            );

          }

        }


        /*
          WhatsApp fallback
        */

        else {

          const whatsappText =
            encodeURIComponent(
              "Shehan & Stephanie\n" +
              "12 • 12 • 2026\n\n" +
              window.location.href
            );

          window.open(
            "https://wa.me/?text=" +
            whatsappText,
            "_blank"
          );

        }

      }
    );

  </script>

</body>
</html>
