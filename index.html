<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shehan & Stephanie</title>


    <!-- WhatsApp / Social Preview -->

    <meta property="og:title"
          content="Shehan & Stephanie">

    <meta property="og:description"
          content="">

    <meta property="og:type"
          content="website">

    <meta property="og:url"
          content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/">

    <meta property="og:image"
          content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/preview.png">

    <meta property="og:image:alt"
          content="Shehan & Stephanie">


    <!-- Social Preview -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Shehan & Stephanie">

    <meta name="twitter:description"
          content="">

    <meta name="twitter:image"
          content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/preview.png">


    <link rel="stylesheet" href="style.css?v=6">

</head>


<body>


    <!-- ==================================================
         OPENING SCREEN
    ================================================== -->

    <div class="start-screen" id="startScreen">

        <div class="intro-card">

            <button id="startButton">
                <span>TAP TO BEGIN</span>
            </button>

        </div>

    </div>



    <!-- ==================================================
         VIDEO
    ================================================== -->

    <div class="video-screen" id="videoScreen">

        <video
            id="weddingVideo"
            playsinline
            preload="auto"
        >

            <source
                src="save-the-date.mp4"
                type="video/mp4"
            >

            Your browser does not support video playback.

        </video>

    </div>



    <!-- ==================================================
         FINAL SAVE THE DATE
    ================================================== -->

    <main class="save-date" id="saveDate">


        <!-- INTRO -->

        <section class="intro">

            <p>
                Out of every possibility,<br>
                life chose this one.<br>
                <span>Us.</span>
            </p>

        </section>



        <!-- COUPLE -->

        <section class="couple">

            <h1>
                Shehan & Stephanie
            </h1>

        </section>



        <!-- STORY -->

        <section class="story">

            <p>
                What began as two separate stories<br>
                will now become one.
            </p>

            <p>
                With love and joy,<br>
                we invite you to celebrate the beginning
                of our forever.
            </p>

        </section>



        <!-- DATE -->

        <section class="date">

            <p>
                12 • 12 • 2026
            </p>

        </section>



        <!-- SHARE -->

        <a
            class="share-button"
            href="#"
            id="shareButton"
        >
            Share This Save the Date
        </a>


    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script>


        const startScreen =
            document.getElementById("startScreen");


        const startButton =
            document.getElementById("startButton");


        const videoScreen =
            document.getElementById("videoScreen");


        const weddingVideo =
            document.getElementById("weddingVideo");


        const saveDate =
            document.getElementById("saveDate");


        const shareButton =
            document.getElementById("shareButton");



        /* ==================================================
           START VIDEO
        ================================================== */

        startButton.addEventListener("click", async () => {

            startScreen.classList.add("launching");


            try {

                await weddingVideo.play();

            } catch (error) {

                console.log(
                    "Video could not start:",
                    error
                );

            }


            setTimeout(() => {

                startScreen.classList.add("hidden");

                videoScreen.classList.add("active");

            }, 900);

        });



        /* ==================================================
           VIDEO FINISHED
        ================================================== */

        weddingVideo.addEventListener("ended", () => {

            videoScreen.classList.add("finished");

            saveDate.classList.add("show");


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        });



        /* ==================================================
           SHARE
        ================================================== */

        shareButton.addEventListener("click", async (event) => {

            event.preventDefault();


            const shareData = {

                title:
                    "Shehan & Stephanie",

                text:
                    "Shehan & Stephanie\n" +
                    "12 • 12 • 2026",

                url:
                    window.location.href

            };


            if (navigator.share) {

                try {

                    await navigator.share(shareData);

                } catch (error) {

                    console.log(
                        "Share cancelled."
                    );

                }

            } else {

                const whatsappText =
                    encodeURIComponent(

                        "Shehan & Stephanie\n" +
                        "12 • 12 • 2026\n\n" +
                        window.location.href

                    );


                window.open(

                    "https://wa.me/?text=" +
                    whatsappText,

                    "_blank"

                );

            }

        });


    </script>


</body>

</html>
