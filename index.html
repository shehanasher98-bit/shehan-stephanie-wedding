<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Shehan & Stephenie</title>

  <!-- WhatsApp / Social Preview -->
  <meta property="og:title" content="Shehan & Stephenie">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/">
  <meta property="og:image" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/preview.png?v=3">
  <meta property="og:image:alt" content="Shehan & Stephenie">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shehan & Stephenie">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/preview.png?v=3">

  <meta name="theme-color" content="#f7f1e6">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =================================
       OPENING SCREEN
  ================================== -->

  <div class="start-screen" id="startScreen">

    <div class="ambient-light ambient-one"></div>
    <div class="ambient-light ambient-two"></div>

    <div class="light-beam"></div>
    <div class="center-glow"></div>

    <div class="grain"></div>

    <div class="touch-light" id="touchLight"></div>

    <!-- Botanical line-art -->
    <svg class="botanical-art botanical-top-left" viewBox="0 0 180 260" aria-hidden="true">
      <path d="M20 245 C45 190 75 135 145 20"/>
      <path d="M48 190 C28 180 18 160 25 140 C45 145 57 160 48 190"/>
      <path d="M68 155 C48 142 45 118 57 101 C76 110 82 132 68 155"/>
      <path d="M91 116 C75 98 78 75 93 61 C108 76 107 98 91 116"/>
      <path d="M113 80 C101 62 108 40 126 30 C137 48 131 68 113 80"/>
    </svg>

    <svg class="botanical-art botanical-bottom-right" viewBox="0 0 180 260" aria-hidden="true">
      <path d="M160 15 C135 70 105 125 35 240"/>
      <path d="M132 70 C152 80 162 100 155 120 C135 115 123 100 132 70"/>
      <path d="M112 105 C132 118 135 142 123 159 C104 150 98 128 112 105"/>
      <path d="M89 145 C105 162 102 185 87 199 C72 184 73 163 89 145"/>
      <path d="M67 182 C79 200 72 222 54 232 C43 214 49 194 67 182"/>
    </svg>

    <!-- Falling hearts -->
    <div class="falling-hearts" aria-hidden="true">
      <span class="fall-heart heart-1">♥</span>
      <span class="fall-heart heart-2">♥</span>
      <span class="fall-heart heart-3">♥</span>
      <span class="fall-heart heart-4">♥</span>
      <span class="fall-heart heart-5">♥</span>
      <span class="fall-heart heart-6">♥</span>
      <span class="fall-heart heart-7">♥</span>
      <span class="fall-heart heart-8">♥</span>
      <span class="fall-heart heart-9">♥</span>
      <span class="fall-heart heart-10">♥</span>
      <span class="fall-heart heart-11">♥</span>
      <span class="fall-heart heart-12">♥</span>
    </div>

    <div class="start-inner">

      <p class="start-eyebrow">Save the Date</p>

      <button
        class="start-button"
        id="startButton"
        aria-label="Tap to begin"
      >
        <span class="start-ring"></span>
        <span>Tap to Begin</span>
        <i></i>
      </button>

      <p class="start-names">Shehan <span>&amp;</span> Stephenie</p>

    </div>

  </div>


  <!-- =================================
       VIDEO
  ================================== -->

  <div class="video-screen" id="videoScreen">

    <video
      id="weddingVideo"
      playsinline
      preload="auto"
    >
      <source
        src="save-the-date.mp4"
        type="video/mp4"
      >

      Your browser does not support video playback.

    </video>

  </div>


  <!-- =================================
       END CARD
  ================================== -->

  <main class="save-date" id="saveDate">

    <div class="frame-corner corner-tl"></div>
    <div class="frame-corner corner-tr"></div>
    <div class="frame-corner corner-bl"></div>
    <div class="frame-corner corner-br"></div>

    <section class="intro">

      <p>
        Out of every possibility,<br>
        life chose this one.<br>
        <span>Us.</span>
      </p>

    </section>

    <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>

    <section class="couple">

      <h1>
        Shehan <em>&amp;</em> Stephenie
      </h1>

    </section>


    <section class="story">

      <p>
        What began as two separate stories<br>
        will now become one.
      </p>

      <p>
        With love and joy,<br>
        we invite you to celebrate the beginning of our forever.
      </p>

    </section>


    <section class="date">

      <p>
        12 <span>•</span> 12 <span>•</span> 2026
      </p>

    </section>

  </main>


  <script>

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");

    const videoScreen =
      document.getElementById("videoScreen");

    const weddingVideo =
      document.getElementById("weddingVideo");

    const saveDate =
      document.getElementById("saveDate");

    const touchLight =
      document.getElementById("touchLight");

    const prefersReducedMotion =
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;


    function revealEndCard() {

      videoScreen.classList.add("finished");

      setTimeout(function () {

        saveDate.classList.add("show");

      }, prefersReducedMotion ? 0 : 800);

    }


    startButton.addEventListener("click", function () {

      if (startButton.disabled) {
        return;
      }

      startButton.disabled = true;

      videoScreen.classList.add("active");

      weddingVideo.currentTime = 0;

      const playPromise =
        weddingVideo.play();

      requestAnimationFrame(function () {

        startScreen.classList.add("launching");

      });


      if (playPromise !== undefined) {

        playPromise.catch(function (error) {

          console.log(
            "Video playback error:",
            error
          );

          revealEndCard();

        });

      }


      setTimeout(function () {

        startScreen.classList.add("hidden");

      }, 950);

    });


    function moveLight(x, y) {

      touchLight.style.left = x + "px";
      touchLight.style.top = y + "px";

    }


    if (window.matchMedia("(hover: hover)").matches) {

      document.addEventListener(
        "mousemove",
        function (event) {

          moveLight(
            event.clientX,
            event.clientY
          );

        }
      );

    }


    document.addEventListener(
      "touchmove",
      function (event) {

        if (event.touches.length > 0) {

          moveLight(
            event.touches[0].clientX,
            event.touches[0].clientY
          );

        }

      },
      { passive: true }
    );


    weddingVideo.addEventListener(
      "ended",
      revealEndCard
    );

  </script>

</body>
</html>
