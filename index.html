<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Shehan & Stephenie</title>

  <!-- WhatsApp / Social Preview -->
  <meta property="og:title" content="Shehan & Stephenie">
  <meta property="og:description" content="Save the Date — 12.12.2026">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shehanasher98-bit.github.io/shehan-stephenie-wedding/">
  <meta property="og:image" content="https://shehanasher98-bit.github.io/shehan-stephenie-wedding/preview.png">
  <meta property="og:image:alt" content="Shehan & Stephenie">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shehan & Stephenie">
  <meta name="twitter:description" content="Save the Date — 12.12.2026">
  <meta name="twitter:image" content="https://shehanasher98-bit.github.io/shehan-stephenie-wedding/preview.png">

  <meta name="theme-color" content="#f7f1e6">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =================================
       OPENING SCREEN
  ================================== -->

  <div class="start-screen" id="startScreen">

    <div class="ambient-light ambient-one"></div>
    <div class="ambient-light ambient-two"></div>

    <div class="light-beam"></div>
    <div class="center-glow"></div>

    <div class="grain"></div>

    <div class="touch-light" id="touchLight"></div>

    <!-- Rose artwork (defined once, reused via <use>) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="roseBloom" viewBox="-40 -40 40 40">
          <g>
            <path d="M0,-2 C-9,-14 -9,-30 0,-34 C9,-30 9,-14 0,-2 Z" fill="#A80000" opacity="0.92" transform="rotate(0)"/>
            <path d="M0,-2 C-9,-14 -9,-30 0,-34 C9,-30 9,-14 0,-2 Z" fill="#A80000" opacity="0.8" transform="rotate(60)"/>
            <path d="M0,-2 C-9,-14 -9,-30 0,-34 C9,-30 9,-14 0,-2 Z" fill="#A80000" opacity="0.92" transform="rotate(120)"/>
            <path d="M0,-2 C-9,-14 -9,-30 0,-34 C9,-30 9,-14 0,-2 Z" fill="#A80000" opacity="0.8" transform="rotate(180)"/>
            <path d="M0,-2 C-9,-14 -9,-30 0,-34 C9,-30 9,-14 0,-2 Z" fill="#A80000" opacity="0.92" transform="rotate(240)"/>
            <path d="M0,-2 C-9,-14 -9,-30 0,-34 C9,-30 9,-14 0,-2 Z" fill="#A80000" opacity="0.8" transform="rotate(300)"/>
            <path d="M-4,-2 C-1,-9 4,-9 5,-3 C6,3 2,5 -2,4 C-6,3 -6,-1 -4,-2 Z" fill="#6e1010"/>
          </g>
        </symbol>

        <symbol id="roseSprig" viewBox="-45 -90 90 130">
          <path d="M0,40 C-4,10 4,-15 0,-38" fill="none" stroke="#7a3030" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M0,14 C-16,10 -26,18 -30,32 C-17,32 -6,26 0,14 Z" fill="#8a3b3b" opacity="0.65"/>
          <path d="M2,-6 C16,-10 26,-3 28,10 C15,10 6,4 2,-6 Z" fill="#8a3b3b" opacity="0.5"/>
          <use href="#roseBloom" transform="translate(0,-38) scale(1.15)"/>
        </symbol>
      </defs>
    </svg>

    <svg class="rose-corner rose-corner-bl" viewBox="-45 -90 90 130" aria-hidden="true"><use href="#roseSprig"/></svg>
    <svg class="rose-corner rose-corner-br" viewBox="-45 -90 90 130" aria-hidden="true"><use href="#roseSprig"/></svg>

    <svg class="rose-float rose-float-1" viewBox="-40 -40 80 80" aria-hidden="true"><use href="#roseBloom"/></svg>
    <svg class="rose-float rose-float-2" viewBox="-40 -40 80 80" aria-hidden="true"><use href="#roseBloom"/></svg>
    <svg class="rose-float rose-float-3" viewBox="-40 -40 80 80" aria-hidden="true"><use href="#roseBloom"/></svg>

    <div class="petal petal-1"></div>
    <div class="petal petal-2"></div>
    <div class="petal petal-3"></div>
    <div class="petal petal-4"></div>
    <div class="petal petal-5"></div>

    <div class="start-inner">
      <p class="start-eyebrow">Save the Date</p>

      <button
        class="start-button"
        id="startButton"
        aria-label="Tap to begin"
      >
        <span class="start-ring"></span>
        <span>Tap to Begin</span>
        <i></i>
      </button>

      <p class="start-names">Shehan <span>&amp;</span> Stephenie</p>
    </div>

  </div>


  <!-- =================================
       VIDEO
  ================================== -->

  <div class="video-screen" id="videoScreen">

    <video
      id="weddingVideo"
      playsinline
      preload="auto"
    >
      <source
        src="save-the-date.mp4"
        type="video/mp4"
      >

      Your browser does not support video playback.

    </video>

  </div>


  <!-- =================================
       END CARD
  ================================== -->

  <main class="save-date" id="saveDate">

    <div class="frame-corner corner-tl"></div>
    <div class="frame-corner corner-tr"></div>
    <div class="frame-corner corner-bl"></div>
    <div class="frame-corner corner-br"></div>

    <section class="intro">

      <p>
        Out of every possibility,<br>
        life chose this one.<br>
        <span>Us.</span>
      </p>

    </section>

    <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>

    <section class="couple">

      <h1>
        Shehan <em>&amp;</em> Stephenie
      </h1>

    </section>


    <section class="story">

      <p>
        What began as two separate stories<br>
        will now become one.
      </p>

      <p>
        With love and joy,<br>
        we invite you to celebrate the beginning of our forever.
      </p>

    </section>


    <section class="date">

      <p>
        12 <span>•</span> 12 <span>•</span> 2026
      </p>

    </section>

  </main>


  <script>

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");

    const videoScreen =
      document.getElementById("videoScreen");

    const weddingVideo =
      document.getElementById("weddingVideo");

    const saveDate =
      document.getElementById("saveDate");

    const touchLight =
      document.getElementById("touchLight");

    const prefersReducedMotion =
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;


    /* =================================
       REVEAL END CARD
    ================================== */

    function revealEndCard() {

      videoScreen.classList.add("finished");

      setTimeout(function () {

        saveDate.classList.add("show");

      }, prefersReducedMotion ? 0 : 800);

    }


    /* =================================
       START VIDEO
    ================================== */

    startButton.addEventListener("click", function () {

      if (startButton.disabled) {
        return;
      }

      startButton.disabled = true;


      /*
        Show the video immediately.
      */

      videoScreen.classList.add("active");


      weddingVideo.currentTime = 0;


      /*
        Start playback immediately from
        the user's tap.
      */

      const playPromise =
        weddingVideo.play();


      /*
        Fade away the opening screen.
        No black transition.
      */

      requestAnimationFrame(function () {

        startScreen.classList.add("launching");

      });


      if (playPromise !== undefined) {

        playPromise.catch(function (error) {

          console.log(
            "Video playback error:",
            error
          );

          /*
            Autoplay was blocked or the
            source failed — don't strand
            the guest on a black screen.
          */

          revealEndCard();

        });

      }


      setTimeout(function () {

        startScreen.classList.add("hidden");

      }, 950);

    });


    /* =================================
       MOVING LIGHT (desktop only)
    ================================== */

    function moveLight(x, y) {

      touchLight.style.left = x + "px";
      touchLight.style.top = y + "px";

    }


    if (window.matchMedia("(hover: hover)").matches) {

      document.addEventListener(
        "mousemove",
        function (event) {

          moveLight(
            event.clientX,
            event.clientY
          );

        }
      );

    }


    document.addEventListener(
      "touchmove",
      function (event) {

        if (event.touches.length > 0) {

          moveLight(
            event.touches[0].clientX,
            event.touches[0].clientY
          );

        }

      },
      { passive: true }
    );


    /* =================================
       VIDEO FINISHED
    ================================== */

    weddingVideo.addEventListener(
      "ended",
      revealEndCard
    );

  </script>

</body>
</html>
