<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Shehan & Stephanie</title>

  <!-- WhatsApp / Social Preview -->
  <meta property="og:title" content="Shehan & Stephanie">
  <meta property="og:description" content="Save the Date — 12.12.2026">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/">
  <meta property="og:image" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/preview.png">
  <meta property="og:image:alt" content="Shehan & Stephanie">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shehan & Stephanie">
  <meta name="twitter:description" content="Save the Date — 12.12.2026">
  <meta name="twitter:image" content="https://shehanasher98-bit.github.io/shehan-stephanie-wedding/preview.png">

  <meta name="theme-color" content="#f7f1e6">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =================================
       OPENING SCREEN
  ================================== -->

  <div class="start-screen" id="startScreen">

    <div class="ambient-light ambient-one"></div>
    <div class="ambient-light ambient-two"></div>

    <div class="light-beam"></div>
    <div class="center-glow"></div>

    <div class="grain"></div>

    <div class="touch-light" id="touchLight"></div>

    <div class="start-inner">
      <p class="start-eyebrow">Save the Date</p>

      <button
        class="start-button"
        id="startButton"
        aria-label="Tap to begin"
      >
        <span class="start-ring"></span>
        <span>Tap to Begin</span>
        <i></i>
      </button>

      <p class="start-names">Shehan <span>&amp;</span> Stephanie</p>
    </div>

  </div>


  <!-- =================================
       VIDEO
  ================================== -->

  <div class="video-screen" id="videoScreen">

    <video
      id="weddingVideo"
      playsinline
      preload="auto"
    >
      <source
        src="save-the-date.mp4"
        type="video/mp4"
      >

      Your browser does not support video playback.

    </video>

    <button class="skip-button" id="skipButton" aria-label="Skip video">
      Skip <span>›</span>
    </button>

  </div>


  <!-- =================================
       END CARD
  ================================== -->

  <main class="save-date" id="saveDate">

    <div class="frame-corner corner-tl"></div>
    <div class="frame-corner corner-tr"></div>
    <div class="frame-corner corner-bl"></div>
    <div class="frame-corner corner-br"></div>

    <section class="intro">

      <p>
        Out of every possibility,<br>
        life chose this one.<br>
        <span>Us.</span>
      </p>

    </section>

    <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>

    <section class="couple">

      <h1>
        Shehan <em>&amp;</em> Stephanie
      </h1>

    </section>


    <section class="story">

      <p>
        What began as two separate stories<br>
        will now become one.
      </p>

      <p>
        With love and joy,<br>
        we invite you to celebrate the beginning of our forever.
      </p>

    </section>


    <section class="date">

      <p>
        12 <span>•</span> 12 <span>•</span> 2026
      </p>

    </section>


    <section class="share-section">

      <button
        class="share-button"
        id="shareButton"
      >
        Share This Save the Date
      </button>

    </section>

  </main>


  <script>

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");

    const videoScreen =
      document.getElementById("videoScreen");

    const weddingVideo =
      document.getElementById("weddingVideo");

    const saveDate =
      document.getElementById("saveDate");

    const touchLight =
      document.getElementById("touchLight");

    const shareButton =
      document.getElementById("shareButton");

    const skipButton =
      document.getElementById("skipButton");

    const prefersReducedMotion =
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;


    /* =================================
       REVEAL END CARD
    ================================== */

    function revealEndCard() {

      videoScreen.classList.add("finished");

      setTimeout(function () {

        saveDate.classList.add("show");

      }, prefersReducedMotion ? 0 : 800);

    }


    /* =================================
       START VIDEO
    ================================== */

    startButton.addEventListener("click", function () {

      if (startButton.disabled) {
        return;
      }

      startButton.disabled = true;


      /*
        Show the video immediately.
      */

      videoScreen.classList.add("active");


      weddingVideo.currentTime = 0;


      /*
        Start playback immediately from
        the user's tap.
      */

      const playPromise =
        weddingVideo.play();


      /*
        Fade away the opening screen.
        No black transition.
      */

      requestAnimationFrame(function () {

        startScreen.classList.add("launching");

      });


      if (playPromise !== undefined) {

        playPromise.catch(function (error) {

          console.log(
            "Video playback error:",
            error
          );

          /*
            Autoplay was blocked or the
            source failed — don't strand
            the guest on a black screen.
          */

          revealEndCard();

        });

      }


      setTimeout(function () {

        startScreen.classList.add("hidden");

      }, 950);

    });


    /* =================================
       SKIP VIDEO
    ================================== */

    skipButton.addEventListener("click", function () {

      weddingVideo.pause();

      revealEndCard();

    });


    /* =================================
       MOVING LIGHT (desktop only)
    ================================== */

    function moveLight(x, y) {

      touchLight.style.left = x + "px";
      touchLight.style.top = y + "px";

    }


    if (window.matchMedia("(hover: hover)").matches) {

      document.addEventListener(
        "mousemove",
        function (event) {

          moveLight(
            event.clientX,
            event.clientY
          );

        }
      );

    }


    document.addEventListener(
      "touchmove",
      function (event) {

        if (event.touches.length > 0) {

          moveLight(
            event.touches[0].clientX,
            event.touches[0].clientY
          );

        }

      },
      { passive: true }
    );


    /* =================================
       VIDEO FINISHED
    ================================== */

    weddingVideo.addEventListener(
      "ended",
      revealEndCard
    );


    /* =================================
       SHARE
    ================================== */

    shareButton.addEventListener(
      "click",
      async function () {

        const shareData = {

          title:
            "Shehan & Stephanie",

          text:
            "Shehan & Stephanie — 12 • 12 • 2026",

          url:
            window.location.href

        };


        if (navigator.share) {

          try {

            await navigator.share(
              shareData
            );

          } catch (error) {

            console.log(
              "Share cancelled."
            );

          }

        } else {

          const whatsappURL =
            "https://wa.me/?text=" +
            encodeURIComponent(
              "Shehan & Stephanie — 12 • 12 • 2026\n\n" +
              window.location.href
            );

          window.open(
            whatsappURL,
            "_blank"
          );

        }

      }
    );

  </script>

</body>
</html>
